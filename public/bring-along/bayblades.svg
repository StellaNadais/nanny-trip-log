  <g class="top2" transform-origin="105 70"><path d="M105 45l15 17-8 26H98l-8-26z" fill="#e95f75"/><path d="M105 49l9 17-9 14-9-14z" fill="#fff1a6"/><path d="M89 88h32l-16 13z" fill="#a33865"/></g>
