  <g class="bucket"><path d="M48 67h43l-5 30H53z" fill="#52b9e9"/><path d="M55 67c0-22 29-22 29 0" fill="none" stroke="#2588c3" stroke-width="5" stroke-linecap="round"/><path d="M48 67h43l-2 8H50z" fill="#f05d5e"/><circle cx="70" cy="83" r="7" fill="#ffdb55"/></g>
  <g transform="rotate(20 111 79)"><path d="M108 49h8v43h-8z" fill="#f58d4f"/><path d="M101 86h22l-5 15h-12z" fill="#72c478"/></g>
