<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="Animated sand bucket and shovel">
  <style>
    .sun { transform-origin: 128px 26px; animation: spin 5s linear infinite; }
    .bucket { transform-origin: 70px 87px; animation: bounce 1.5s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bounce { 50% { transform: translateY(-5px) rotate(-3deg); } }
  </style>
